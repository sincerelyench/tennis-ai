plugins {
    id "com.android.application"
}

android {
    namespace "app.zhangqiu"
    compileSdk 34

    defaultConfig {
        applicationId "app.zhangqiu"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
