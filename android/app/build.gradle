plugins {
    id "com.android.application"
}

// 打包时覆盖：./gradlew assembleDebug -PZQ_START_URL=http://10.0.2.2:27116/e1
def zqStartUrl = (project.findProperty("ZQ_START_URL") ?: "https://tennis.47.93.203.28.sslip.io/e1").toString()

android {
    namespace "app.zhangqiu"
    compileSdk 34

    defaultConfig {
        applicationId "app.zhangqiu"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        resValue "string", "start_url", zqStartUrl
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
