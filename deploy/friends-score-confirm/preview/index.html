<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>涨球 · 比分确认预览</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 24px; max-width: 720px; color: #111; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #4b5563; line-height: 1.6; }
      code { background: #f3f4f6; padding: 2px 6px; border-radius: 6px; }
      ul { line-height: 1.7; }
      a { color: #0f766e; }
    </style>
  </head>
  <body>
    <h1>球友录入比分 · 对方确认后进系统</h1>
    <p>
      成绩提交后为 <code>pending</code>；对方确认后才写入排行 / UTR。无真实登录用户时列表与匹配显示
      <strong>0</strong>。
    </p>
    <ul>
      <li><code>POST /tennis/api/friends/scores</code> → pending</li>
      <li><code>POST /tennis/api/friends/scores/action</code> → confirm / reject</li>
      <li><code>GET /tennis/api/friends/ladder</code> → 仅 confirmed 比赛</li>
    </ul>
    <p><a href="/tennis/friends">打开球友页</a></p>
  </body>
</html>
