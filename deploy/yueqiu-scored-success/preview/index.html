<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>约球成功 · 已录分内联</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #111; }
    h1 { font-size: 1.25rem; }
    code { background: #f4f4f5; padding: 0.1em 0.35em; border-radius: 4px; }
    ul { padding-left: 1.2rem; }
  </style>
</head>
<body>
  <h1>约球成功：已录分内联展示</h1>
  <p>「我的约球」里成绩只挂在约球成功行上；已录分不再显示「录入比分」，也不再另开「比分记录」。</p>
  <ul>
    <li>未录分 → 行内「录入比分」（表单折叠）</li>
    <li>已录分 → 比分 / 胜者 / 时间，无录入按钮</li>
    <li>标记：<code>data-match-records-inline-scores</code>、<code>data-match-success-scored</code></li>
  </ul>
  <p>线上页：<a href="/tennis/friends">/tennis/friends</a></p>
</body>
</html>
