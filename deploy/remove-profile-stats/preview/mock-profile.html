<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>涨球 · 我的（预览）</title>
  <style>
    :root { --green: #1f7a4d; --green2: #166534; --card: #fff; --bd: #e5e7eb; --muted: #6b7280; --bg: #f3f4f6; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif; background: var(--bg); color: #111; }
    .phone { max-width: 390px; margin: 0 auto; min-height: 100vh; background: #f8faf8; padding: 12px 14px 80px; }
    .brand { font-weight: 800; font-size: 15px; color: var(--green); margin: 4px 0 10px; }
    .hero { background: linear-gradient(145deg, var(--green), var(--green2)); color: #fff; border-radius: 12px; padding: 18px; }
    .row { display: flex; gap: 12px; align-items: center; }
    .avatar { width: 56px; height: 56px; border-radius: 999px; background: rgba(255,255,255,.2); border: 2px solid rgba(255,255,255,.35); display:flex; align-items:center; justify-content:center; font-size: 22px; }
    .name { font-size: 20px; font-weight: 700; margin: 0; }
    .meta { font-size: 12px; opacity: .9; margin-top: 4px; }
    .box { margin-top: 12px; background: rgba(255,255,255,.12); border-radius: 8px; padding: 10px; font-size: 12px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px; background: rgba(255,255,255,.12); border-radius: 8px; padding: 12px 8px; text-align: center; }
    .stats .n { font-size: 18px; font-weight: 700; }
    .stats .l { font-size: 11px; opacity: .85; margin-top: 2px; }
    .stats .split { border-left: 1px solid rgba(255,255,255,.25); }
    h2 { font-size: 15px; margin: 18px 0 8px; }
    .card { background: var(--card); border: 1px solid var(--bd); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .label { font-size: 12px; color: var(--muted); }
    .big { font-size: 22px; font-weight: 700; margin-top: 8px; }
    .menu { background: var(--card); border: 1px solid var(--bd); border-radius: 10px; overflow: hidden; }
    .menu a { display: flex; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--bd); text-decoration: none; color: inherit; font-size: 14px; }
    .menu a:last-child { border-bottom: 0; }
    .after .stats, .after .trend-grid { display: none !important; }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #dcfce7; color: #166534; margin-left: 8px; }
    .toggle { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--bd); padding: 8px 14px; display: flex; gap: 8px; max-width: 390px; margin: 0 auto; }
    .toggle button { flex: 1; height: 34px; border-radius: 8px; border: 1px solid var(--bd); background: #fff; font-weight: 600; }
    .toggle button.on { background: var(--green); color: #fff; border-color: var(--green); }
  </style>
</head>
<body>
  <div class="toggle">
    <button type="button" id="btn-before" class="on">改前</button>
    <button type="button" id="btn-after">改后</button>
  </div>
  <div class="phone" id="phone">
    <div class="brand">涨球</div>
    <section class="hero">
      <div class="row">
        <div class="avatar">👤</div>
        <div>
          <p class="name">球员 <span style="font-size:11px;background:rgba(255,255,255,.2);padding:2px 6px;border-radius:999px;">NTRP 3.0</span></p>
          <p class="meta">📍 当前位置 · 上海</p>
        </div>
      </div>
      <div class="box">显示名（球友/教练可见） · 保存</div>
      <div class="box">当前位置 / 城市（球友排行与匹配用） · 上海 ▾</div>
      <div class="stats" id="stats">
        <div><div class="n">12</div><div class="l">分析次数</div></div>
        <div class="split"><div class="n">28h</div><div class="l">训练时长</div></div>
        <div class="split"><div class="n">0</div><div class="l">球友</div></div>
      </div>
    </section>
    <h2>我的数据 <span class="badge" id="state-badge">改前</span></h2>
    <div class="card">成长轨迹<br><span class="label">查看进步曲线与历史</span></div>
    <div class="cols trend-grid" id="trend">
      <div class="card"><div class="label">近期等级走势</div><div class="big">B+</div></div>
      <div class="card"><div class="label">练得最多</div><div class="big">正手</div><div class="label">占比 42%</div></div>
    </div>
    <h2>设置</h2>
    <div class="menu">
      <a href="#"><span>成长轨迹</span><span>›</span></a>
      <a href="#"><span>分析报告</span><span>›</span></a>
      <a href="#"><span>通知</span><span>›</span></a>
      <a href="#"><span>帮助</span><span>›</span></a>
    </div>
  </div>
  <script>
    var phone = document.getElementById("phone");
    var badge = document.getElementById("state-badge");
    var before = document.getElementById("btn-before");
    var after = document.getElementById("btn-after");
    function setAfter(on) {
      phone.classList.toggle("after", on);
      badge.textContent = on ? "改后" : "改前";
      before.classList.toggle("on", !on);
      after.classList.toggle("on", on);
      document.title = on ? "涨球 · 我的（改后）" : "涨球 · 我的（改前）";
    }
    before.onclick = function () { setAfter(false); };
    after.onclick = function () { setAfter(true); };
    if (location.search.indexOf("after=1") >= 0) setAfter(true);
  </script>
</body>
</html>
