<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>涨球 · AI 涨球教练 + 真人网络教练留言</title>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fff;
      --fg: #14201a;
      --muted: #5b6b63;
      --primary: #1f7a4c;
      --line: #d7e3dc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans SC", "PingFang SC", sans-serif;
      color: var(--fg);
      min-height: 100vh;
      background:
        radial-gradient(1000px 420px at 8% -8%, #d9efe3 0%, transparent 55%),
        linear-gradient(180deg, #e3efe8 0%, var(--bg) 50%, #e8eee9 100%);
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.78); backdrop-filter: blur(8px);
      position: sticky; top: 0;
    }
    .brand { font-weight: 800; font-size: 18px; }
    .lang, .tab {
      border: 0; border-radius: 999px; padding: 7px 12px; font-weight: 700; font-size: 12px; cursor: pointer;
      background: #e9f7ef; color: var(--primary);
    }
    .tabs { display: flex; gap: 6px; }
    .tab.on { background: var(--primary); color: #fff; }
    main { max-width: 460px; margin: 0 auto; padding: 20px 16px 80px; }
    .eyebrow { color: var(--primary); font-size: 12px; font-weight: 700; }
    h1 { font-size: 22px; margin: 6px 0 8px; }
    .lead { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
    .chip {
      flex: 1; min-width: 42%; border: 1px solid var(--line); border-radius: 12px;
      padding: 12px; background: var(--card); text-align: left; cursor: pointer;
    }
    .chip.on { border-color: var(--primary); background: #eef8f2; }
    .chip b { display: block; font-size: 14px; }
    .chip span { display: block; margin-top: 4px; font-size: 11px; color: var(--primary); font-weight: 700; }
    .chip i { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); font-style: normal; }
    .panel {
      border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 12px; margin-top: 10px;
    }
    .log { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow: auto; }
    .bubble { max-width: 88%; padding: 8px 10px; border-radius: 12px; font-size: 13px; line-height: 1.45; }
    .bubble.user { align-self: flex-end; background: var(--primary); color: #fff; }
    .bubble.coach { align-self: flex-start; border: 1px solid var(--line); background: #fff; }
    .note {
      padding: 8px 10px; border-radius: 10px; background: #f3f7f4; border: 1px dashed #c9d9cf;
      font-size: 12px; color: var(--muted); line-height: 1.45; margin-bottom: 8px;
    }
    .msg {
      border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: #fff;
    }
    .msg .meta { font-size: 11px; color: var(--muted); font-weight: 700; }
    .msg .body { margin-top: 6px; font-size: 13px; line-height: 1.45; }
    .msg .status { margin-top: 6px; font-size: 11px; color: var(--primary); font-weight: 700; }
    form { display: flex; gap: 8px; margin-top: 10px; }
    form.col { flex-direction: column; }
    input, textarea {
      flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: inherit;
    }
    textarea { min-height: 72px; resize: vertical; }
    button.send, button.ghost, button.primary {
      border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 700; cursor: pointer;
    }
    button.send, button.primary { background: var(--primary); color: #fff; }
    button.ghost { background: #eef3f0; color: var(--fg); }
    .picker .card {
      border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 8px;
      display: flex; justify-content: space-between; gap: 8px; align-items: center;
    }
    .picker .card.on { border-color: var(--primary); background: #eef8f2; }
    .hidden { display: none !important; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .empty { font-size: 12px; color: var(--muted); padding: 8px 0; }
  </style>
</head>
<body>
  <header>
    <div class="brand">涨球</div>
    <div class="tabs">
      <button class="tab on" id="tabChat" type="button">教练</button>
      <button class="tab" id="tabPick" type="button">选教练</button>
      <button class="lang" id="langBtn" type="button">EN</button>
    </div>
  </header>
  <main>
    <section id="viewChat" data-network-coach-chat="true" data-coach-mode="ai-chat">
      <div class="eyebrow" id="eye">AI 涨球教练 · 真人网络教练</div>
      <h1 id="title">我的教练</h1>
      <p class="lead" id="lead">涨球教练是 AI 即时问答；网络教练是平台真人，用留言沟通。</p>
      <div class="row" data-coach-chat-personas="true" id="personaRow"></div>
      <p class="hint" id="hint"></p>
      <div class="panel" id="panel">
        <div class="note hidden" id="humanNote" data-coach-panel="human-intro"></div>
        <div class="log" id="log" data-coach-panel="ai-chat"></div>
        <form id="formAi" data-coach-composer="ai">
          <input id="inputAi" maxlength="400" placeholder="问问涨球教练…" />
          <button class="send" type="submit" id="sendBtn">发送</button>
        </form>
        <form id="formMsg" class="col hidden" data-coach-composer="message">
          <textarea id="inputMsg" maxlength="400" placeholder="给教练留言…"></textarea>
          <button class="send" type="submit" id="leaveBtn">留言</button>
        </form>
      </div>
    </section>

    <section id="viewPick" class="picker hidden" data-coach-picker="true">
      <div class="eyebrow">涨球</div>
      <h1 id="pickTitle">选教练</h1>
      <p class="lead" id="pickLead">仅列出已发布网络教练。选用后回到教练 tab 可留言。</p>
      <div id="coachList"></div>
    </section>
  </main>
  <script>
    const SEL = "tennis-player-selected-coach-v1";
    const PUB = "tennis-coach-publish-v1";
    const MSG = "tennis-network-coach-messages-v1";
    const ZHANGQIU = { id: "poppy", nameZh: "涨球教练", nameEn: "Zhangqiu Coach" };
    const DEMO = {
      coachId: "lin_kai",
      displayName: "林凯教练",
      displayNameEn: "Coach Lin Kai",
      styleTagline: "底线对抗 · 脚步先行",
      styleTaglineEn: "Baseline battle · feet first",
      status: "published",
      publishedAt: new Date().toISOString(),
      libraryStrokeCount: 2,
    };

    let locale = "zh";
    let view = "chat";
    let active = "poppy";
    let messages = [];
    let board = [];

    function scrub(n) {
      const raw = String(n || "").trim();
      if (!raw || /poppy|东东|dongdong|掌球/i.test(raw)) return locale === "zh" ? "涨球教练" : "Zhangqiu Coach";
      return raw;
    }

    function isAi(id) {
      return !id || id === "poppy" || id === "zhangqiu";
    }

    function ensureSeed() {
      let pub = {};
      try { pub = JSON.parse(localStorage.getItem(PUB) || "{}"); } catch {}
      pub.lin_kai = Object.assign({}, DEMO, pub.lin_kai || {}, { status: "published", displayName: scrub(DEMO.displayName) });
      pub.poppy = Object.assign({}, pub.poppy || {}, {
        coachId: "poppy",
        displayName: "涨球教练",
        styleTagline: locale === "zh" ? "AI 默认人格" : "AI default",
        status: "published",
        libraryStrokeCount: 1,
      });
      localStorage.setItem(PUB, JSON.stringify(pub));
      if (!localStorage.getItem(SEL) || localStorage.getItem(SEL) === "poppy") {
        localStorage.setItem(SEL, "lin_kai");
      }
    }

    function selectedNetwork() {
      const id = localStorage.getItem(SEL) || "";
      if (!id || isAi(id)) return null;
      let pub = {};
      try { pub = JSON.parse(localStorage.getItem(PUB) || "{}"); } catch {}
      const card = pub[id];
      if (!card || card.status !== "published") return { id, name: locale === "zh" ? "网络教练" : "Network coach", style: "" };
      return {
        id,
        name: scrub(locale === "zh" ? card.displayName : (card.displayNameEn || card.displayName)),
        style: locale === "zh" ? (card.styleTagline || "") : (card.styleTaglineEn || card.styleTagline || ""),
      };
    }

    function readBoard(id) {
      try {
        const all = JSON.parse(localStorage.getItem(MSG) || "{}");
        return Array.isArray(all[id]) ? all[id] : [];
      } catch { return []; }
    }

    function writeBoard(id, list) {
      try {
        const all = JSON.parse(localStorage.getItem(MSG) || "{}");
        all[id] = list.slice(-40);
        localStorage.setItem(MSG, JSON.stringify(all));
      } catch {}
    }

    function helloAi() {
      return locale === "zh"
        ? "我是涨球教练（AI）。一次一条提示，先把击球点送到身前。"
        : "I’m Zhangqiu Coach (AI). One cue at a time — meet the ball out front.";
    }

    function replyAi(q) {
      return locale === "zh"
        ? `涨球教练：关于「${q.slice(0, 36)}」——先把击球点再往身前送一个拍头，力量放在击球之后。`
        : `Zhangqiu Coach: On “${q.slice(0, 36)}” — meet it a racket-head farther in front; power after contact.`;
    }

    function formatTime(iso) {
      try {
        return new Date(iso).toLocaleString(locale === "zh" ? "zh-CN" : "en-US", {
          month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit",
        });
      } catch { return ""; }
    }

    function renderPersonas() {
      const net = selectedNetwork();
      const row = document.getElementById("personaRow");
      const zOn = isAi(active);
      row.innerHTML =
        `<button class="chip ${zOn ? "on" : ""}" data-id="poppy" data-coach-kind="zhangqiu" data-coach-selected="${zOn}" type="button">` +
        `<b data-coach-name="true">${locale === "zh" ? ZHANGQIU.nameZh : ZHANGQIU.nameEn}</b>` +
        `<span>${zOn ? (locale === "zh" ? "正在问答" : "Chatting") : (locale === "zh" ? "AI 教练 · 即时问答" : "AI coach · Instant Q&A")}</span></button>` +
        (net
          ? `<button class="chip ${!zOn ? "on" : ""}" data-id="${net.id}" data-coach-kind="network" data-coach-selected="${!zOn}" type="button">` +
            `<b data-coach-name="true">${net.name}</b>` +
            `<span>${!zOn ? (locale === "zh" ? "留言中" : "Messaging") : (locale === "zh" ? "真人教练 · 留言" : "Human coach · Messages")}</span>` +
            (net.style ? `<i>${net.style}</i>` : "") +
            `</button>`
          : "");
      row.querySelectorAll("button").forEach((btn) => {
        btn.onclick = () => {
          active = btn.getAttribute("data-id");
          if (isAi(active)) {
            messages = [{ role: "coach", text: helloAi() }];
            board = [];
          } else {
            board = readBoard(active);
            messages = [];
          }
          renderPanel();
          renderPersonas();
        };
      });
      document.getElementById("hint").textContent = net
        ? (locale === "zh"
          ? `已选网络教练：${net.name}。点上方芯片：AI 问答 / 真人留言。`
          : `Network coach: ${net.name}. Switch chips: AI chat / human messages.`)
        : (locale === "zh" ? "还没选网络教练，打开「选教练」。" : "No network coach yet — open Choose coach.");
    }

    function renderPanel() {
      const ai = isAi(active);
      const net = selectedNetwork();
      document.getElementById("viewChat").setAttribute("data-coach-mode", ai ? "ai-chat" : "human-message");
      document.getElementById("formAi").classList.toggle("hidden", !ai);
      document.getElementById("formMsg").classList.toggle("hidden", ai);
      const note = document.getElementById("humanNote");
      note.classList.toggle("hidden", ai);
      if (!ai) {
        note.textContent = locale === "zh"
          ? `${net ? net.name : "网络教练"}是平台真人教练。请留言，教练会择时回复——不是即时 AI 问答。`
          : `${net ? net.name : "Network coach"} is a real platform coach. Leave a message — they reply later, not instant AI chat.`;
      }
      const log = document.getElementById("log");
      log.setAttribute("data-coach-panel", ai ? "ai-chat" : "human-board");
      log.innerHTML = "";
      if (ai) {
        messages.forEach((m) => {
          const d = document.createElement("div");
          d.className = "bubble " + (m.role === "user" ? "user" : "coach");
          d.textContent = m.text;
          log.appendChild(d);
        });
      } else if (!board.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = locale === "zh" ? "还没有留言。写一条技术问题或训练反馈吧。" : "No messages yet. Leave a technique question or training note.";
        log.appendChild(empty);
      } else {
        board.forEach((m) => {
          const d = document.createElement("div");
          d.className = "msg";
          d.innerHTML = `<div class="meta">${formatTime(m.at)}</div><div class="body"></div><div class="status">${locale === "zh" ? "已留言，等待教练回复" : "Sent — waiting for coach reply"}</div>`;
          d.querySelector(".body").textContent = m.text;
          log.appendChild(d);
        });
      }
      log.scrollTop = log.scrollHeight;
    }

    function renderPicker() {
      const list = document.getElementById("coachList");
      let pub = {};
      try { pub = JSON.parse(localStorage.getItem(PUB) || "{}"); } catch {}
      const selected = localStorage.getItem(SEL);
      const cards = Object.values(pub).filter((c) => c.status === "published" && c.coachId !== "poppy");
      list.innerHTML = cards.map((c) => {
        const on = c.coachId === selected;
        const name = scrub(locale === "zh" ? c.displayName : (c.displayNameEn || c.displayName));
        return `<div class="card ${on ? "on" : ""}" data-coach-id="${c.coachId}" data-selected="${on ? 1 : 0}">
          <div><b data-coach-name="true">${name}</b><div class="hint">${locale === "zh" ? (c.styleTagline || "") : (c.styleTaglineEn || c.styleTagline || "")}</div></div>
          <button class="primary" type="button" data-action="select-coach" data-id="${c.coachId}">${on ? (locale === "zh" ? "当前选用" : "Selected") : (locale === "zh" ? "选用" : "Select")}</button>
        </div>`;
      }).join("") || `<p class="hint">${locale === "zh" ? "暂无已发布网络教练" : "No published network coaches"}</p>`;
      list.querySelectorAll("[data-action=select-coach]").forEach((btn) => {
        btn.onclick = () => {
          localStorage.setItem(SEL, btn.getAttribute("data-id"));
          active = btn.getAttribute("data-id");
          board = readBoard(active);
          messages = [];
          renderPicker();
          setView("chat");
        };
      });
    }

    function setView(v) {
      view = v;
      document.getElementById("viewChat").classList.toggle("hidden", v !== "chat");
      document.getElementById("viewPick").classList.toggle("hidden", v !== "pick");
      document.getElementById("tabChat").classList.toggle("on", v === "chat");
      document.getElementById("tabPick").classList.toggle("on", v === "pick");
      if (v === "chat") { renderPersonas(); renderPanel(); }
      else renderPicker();
    }

    function applyLocale() {
      document.getElementById("title").textContent = locale === "zh" ? "我的教练" : "My coaches";
      document.getElementById("lead").textContent = locale === "zh"
        ? "涨球教练是 AI 即时问答；网络教练是平台真人，用留言沟通。"
        : "Zhangqiu Coach is AI chat; network coaches are real people via messages.";
      document.getElementById("eye").textContent = locale === "zh" ? "AI 涨球教练 · 真人网络教练" : "AI Zhangqiu · Human network coach";
      document.getElementById("pickTitle").textContent = locale === "zh" ? "选教练" : "Choose coach";
      document.getElementById("pickLead").textContent = locale === "zh"
        ? "仅列出已发布网络教练。选用后回到教练 tab 可留言。"
        : "Published network coaches only. Select one, then leave messages on the Coach tab.";
      document.getElementById("inputAi").placeholder = locale === "zh" ? "问问涨球教练…" : "Ask Zhangqiu Coach…";
      document.getElementById("inputMsg").placeholder = locale === "zh" ? "给教练留言…" : "Leave a message…";
      document.getElementById("sendBtn").textContent = locale === "zh" ? "发送" : "Send";
      document.getElementById("leaveBtn").textContent = locale === "zh" ? "留言" : "Leave message";
      document.getElementById("tabChat").textContent = locale === "zh" ? "教练" : "Coach";
      document.getElementById("tabPick").textContent = locale === "zh" ? "选教练" : "Choose";
      document.getElementById("langBtn").textContent = locale === "zh" ? "EN" : "中文";
      if (isAi(active)) messages = [{ role: "coach", text: helloAi() }];
      else board = readBoard(active);
      setView(view);
    }

    document.getElementById("formAi").onsubmit = (e) => {
      e.preventDefault();
      if (!isAi(active)) return;
      const q = document.getElementById("inputAi").value.trim();
      if (!q) return;
      document.getElementById("inputAi").value = "";
      messages.push({ role: "user", text: q });
      messages.push({ role: "coach", text: replyAi(q) });
      renderPanel();
    };
    document.getElementById("formMsg").onsubmit = (e) => {
      e.preventDefault();
      if (isAi(active)) return;
      const q = document.getElementById("inputMsg").value.trim();
      if (!q) return;
      document.getElementById("inputMsg").value = "";
      board.push({ id: Date.now(), text: q, at: new Date().toISOString(), status: "pending" });
      writeBoard(active, board);
      renderPanel();
    };
    document.getElementById("tabChat").onclick = () => setView("chat");
    document.getElementById("tabPick").onclick = () => setView("pick");
    document.getElementById("langBtn").onclick = () => { locale = locale === "zh" ? "en" : "zh"; applyLocale(); };

    ensureSeed();
    applyLocale();
  </script>
</body>
</html>
