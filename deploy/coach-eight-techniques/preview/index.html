<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>涨球教练 · 八项技术分步练</title>
  <style>
    :root {
      --bg: #0f1f17;
      --card: #15261d;
      --ink: #f2f7f3;
      --muted: #a7b9ad;
      --accent: #3dcf8e;
      --line: #2a4034;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", "Source Han Sans SC", sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1d3a2b, var(--bg));
      color: var(--ink);
      min-height: 100vh;
    }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.35rem; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    button.chip {
      border: 1px solid var(--line);
      background: #1a2c22;
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button.chip[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }
    .bubble {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 14px 10px;
      margin-bottom: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
    }
    .drill {
      background: #101c15;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
    }
    .drill .tag { color: var(--accent); font-size: 0.75rem; font-weight: 700; }
    .drill h2 { font-size: 1.05rem; margin: 6px 0; }
    .phase { margin-top: 12px; }
    .phase h3 { font-size: 0.92rem; margin: 0 0 4px; }
    .phase ul { margin: 0; padding-left: 1.1rem; color: var(--muted); font-size: 0.85rem; }
    .brand { font-weight: 700; letter-spacing: 0.02em; }
  </style>
</head>
<body>
  <main>
    <p class="brand">涨球教练</p>
    <h1>八项技术 · 分步带练</h1>
    <p class="sub">用户说想学某动作时，按对应章节：准备 → 引拍 → 击球 → 随挥 → 动力链 → 常见错误（按该章适用项）。「正手上旋」→ 底线正手。</p>
    <div class="chips" id="chips" role="group" aria-label="想学的技术"></div>
    <div class="bubble" id="reply" data-coach-mode="ai-chat"></div>
    <div class="drill" id="drill" data-coach-drill="fh-topspin" hidden></div>
  </main>
  <script>
    const CANON = {
      "fh-topspin": {
        title: "底线正手",
        aliases: "正手上旋",
        steps: [
          { phase: "准备", cues: ["重心降低", "步幅略宽于肩", "双手举在身体正前方", "左肩对准来球"] },
          { phase: "引拍", cues: ["身体作为整体转体拉拍，从前往后没有任何多余动作", "保持准备姿势不变，仅通过转动身体完成拉拍", "完成后：主导手掌心朝向 6:00（后下方），手掌心朝下后下方", "右手选手：主导手（右手）指向 6:00，辅助手（左手）指向 3:00", "左手选手：主导手（左手）指向 6:00，辅助手（右手）指向 9:00"] },
          { phase: "击球", cues: ["拍子由高往下放，到达腰间高度", "自下而上击球（标准上旋球动作）", "击球瞬间手臂做内旋", "收拍打到左肩膀（右手选手）", "击球点：胸口高度，身体右侧稍远距离，身体前方 45° 方向"] },
          { phase: "随挥", cues: ["击球后手臂内旋，往前上方收拍", "不能垂直向上收拍", "随挥时手掌心朝向外侧，不是朝向身体", "收拍位置取决于上旋程度：重上旋时收拍位置更低"] },
          { phase: "动力链", cues: ["发力顺序自下而上：腿 → 腰髋 → 躯干 → 肩膀 → 手臂 → 球拍"] },
          { phase: "常见错误", cues: ["「擦玻璃」动作：拉拍完成后掌心朝向侧面（而非后下方），导致击球打向天花板。正确做法：掌心朝向后下方，做「拍凳子」动作，由高往低拍，再向前击打", "只动手不转体：拉拍只有持拍手在动，身体没有转，导致力量脱节、打不准球", "击球时重心未向前转移：原地发力，球打不远打不深", "用左手（辅助手）指球，而非左肩指球：转体蓄力不够"] }
        ]
      },
      "bh-topspin": {
        title: "底线反手",
        aliases: "反手上旋",
        steps: [
          { phase: "准备", cues: ["对手击球时立即转肩（左肩对球网，右手选手）", "非持拍手扶拍喉辅助引拍", "双脚与肩同宽，膝盖微屈，重心在前脚掌"] },
          { phase: "引拍", cues: ["非持拍手推动球拍向后，拍头高于手腕", "用肩膀转动带动引拍（不只用手臂）", "双手反拍：左肘贴近身体", "单反：拍面稍关闭"] },
          { phase: "击球", cues: ["身体前方（约髋部高度）击球", "手腕固定，拍面垂直地面", "重心从后脚转移到前脚", "单反：伸直手臂击球", "双手反拍：左手（上侧手）发力主导"] },
          { phase: "随挥", cues: ["继续向前推送，拍头随挥至肩部以上", "双手反拍收拍过高易失误", "非持拍手接住拍颈，帮助制动还原"] },
          { phase: "常见错误", cues: ["引拍过晚：被球挤到，只能用「捞球」动作", "手腕松动：掉拍头或翻腕，球易下网或飞出", "重心后仰：击球时身体后倒，击球点过高"] }
        ]
      },
      serve: {
        title: "发球",
        aliases: "发球",
        steps: [
          { phase: "三种发球对比", cues: ["平击：击球点最高点（12 点）；挥拍从后向前直线撞击；效果低平、前冲快", "侧旋：击球点偏右（2 点）；从右向左横向摩擦；弹跳低、向外拐", "侧上旋：击球点偏左（10 点）；从下向上提拉摩擦；弹跳高、前冲猛"] },
          { phase: "准备", cues: ["侧身时左肩对准球网"] },
          { phase: "击球", cues: ["平击 / 侧旋 / 侧上旋按章节要点分别练习"] },
          { phase: "实战策略", cues: ["Deuce 侧（一区）：侧上旋发外角压反手，平击发内角追身", "Ad 侧（二区）：侧旋发外角拉开正手，平击发内角压反手", "二发：以侧上旋为主"] }
        ]
      },
      smash: {
        title: "高压球",
        aliases: "高压",
        steps: [
          { phase: "准备", cues: ["对方挑高球后，立刻侧身转肩，左肩对准来球", "非持拍手上举指球（像瞄准镜）", "后交叉步或侧滑步快速后退", "绝不仰头后退，必须侧身跑动"] },
          { phase: "引拍", cues: ["非持拍手继续指球", "持拍手自然下垂，「挠背」姿势（拍头朝下，肘部朝上）", "引拍幅度比发球更小"] },
          { phase: "击球", cues: ["身体正上方偏右前，手臂几乎伸直的最高点", "重心从后脚转移到前脚", "手腕内旋，拍面垂直撞击球后上部", "「用指尖去够天花板」"] },
          { phase: "随挥", cues: ["拍头向前下方挥动至身体对侧下方", "非持拍手接拍颈制动"] },
          { phase: "常见错误", cues: ["下网 → 击球点太低/拍面过闭 → 后退半步，拍面打开", "出底线 → 手腕翻动/身体后仰 → 手腕内旋固定，重心前压", "打不到甜区 → 非持拍手没指球"] }
        ]
      }
    };

    const chips = [
      ["fh-topspin", "我想学正手上旋"],
      ["bh-topspin", "我想学反手上旋"],
      ["serve", "我想学发球"],
      ["smash", "我想学高压"],
    ];

    const chipsEl = document.getElementById("chips");
    const replyEl = document.getElementById("reply");
    const drillEl = document.getElementById("drill");

    function render(id) {
      const item = CANON[id];
      chipsEl.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.id === id ? "true" : "false"));
      const order = item.steps.map((s) => s.phase).join(" → ");
      const first = item.steps[0];
      replyEl.textContent =
        `好，我们按「${item.title}」来练（${item.aliases} → ${item.title}）。\n` +
        `顺序：${order}。\n` +
        `先从【${first.phase}】开始：\n` +
        first.cues.map((c) => `· ${c}`).join("\n") +
        `\n练完这步跟我说「下一步」。`;
      drillEl.hidden = false;
      drillEl.setAttribute("data-coach-drill", id);
      drillEl.setAttribute("data-drill-title", item.title);
      drillEl.innerHTML =
        `<p class="tag">涨球教练 · 分步练习</p><h2>${item.title}</h2>` +
        `<p style="color:var(--muted);font-size:0.85rem;margin:0 0 4px">按「${item.title}」章节分步练：${order}。</p>` +
        item.steps
          .map(
            (s) =>
              `<div class="phase" data-drill-phase="${s.phase}"><h3>${s.phase}</h3><ul>${s.cues
                .map((c) => `<li>${c}</li>`)
                .join("")}</ul></div>`,
          )
          .join("");
    }

    chips.forEach(([id, label]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.dataset.id = id;
      b.textContent = label;
      b.addEventListener("click", () => render(id));
      chipsEl.appendChild(b);
    });

    render("fh-topspin");
  </script>
</body>
</html>
