# 挂到 yqchen.blog 的现有 HTTPS server 里（不要单独再开一个 443 server）。
# 网球测评 GPU 服务在 47.93.203.28，本机只做反代。
# 用法：在博客机上执行 deploy/publish-yqchen-tai.sh

location = /tai {
    return 301 /tai/;
}

location ^~ /tai/ {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $tai_cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        add_header Content-Type text/plain always;
        return 204;
    }
    proxy_pass http://47.93.203.28/tennis-ai/;
    proxy_http_version 1.1;
    proxy_set_header Host 47.93.203.28;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /tai;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    client_max_body_size 400m;
    # Stream body to GPU instead of buffering twice (blog nginx + GPU nginx).
    # Buffering made large analyze POSTs hit client abort → nginx 499.
    proxy_request_buffering off;
    client_body_buffer_size 16m;
    client_body_timeout 900s;
    add_header Access-Control-Allow-Origin $tai_cors_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Vary Origin always;
}
