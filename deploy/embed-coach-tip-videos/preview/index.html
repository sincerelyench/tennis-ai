<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>涨球 · 对话指导内嵌讲解视频</title>
  <style>
    :root { --bg:#f3f7f4; --card:#fff; --line:#d7e3db; --ink:#14241a; --muted:#5b6f63; --pri:#0f8f6a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "PingFang SC","Noto Sans SC",sans-serif; background:linear-gradient(180deg,#e8f3ec,#f7faf8); color:var(--ink); }
    .wrap { max-width:430px; margin:0 auto; padding:16px 14px 40px; }
    .brand { font-weight:800; font-size:20px; }
    .personas { display:flex; gap:8px; margin:12px 0; }
    .persona { flex:1; border:1px solid var(--line); border-radius:12px; background:var(--card); padding:10px; }
    .persona.on { border-color:var(--pri); background:#edf9f4; }
    .persona .n { font-weight:700; font-size:14px; }
    .persona .s { margin-top:4px; color:var(--pri); font-size:11px; font-weight:600; }
    .tabs { display:flex; gap:8px; margin:8px 0 14px; }
    .tab { flex:1; border:0; border-radius:10px; padding:10px; font-weight:700; background:#e6eee9; color:var(--muted); }
    .tab.on { background:var(--pri); color:#fff; }
    .bubble { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; font-size:14px; line-height:1.6; }
    .video-lesson { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#0b1220; margin-top:10px; }
    .video-lesson .hd { background:#fff; padding:8px 10px 4px; color:var(--pri); font-size:11px; font-weight:700; }
    .video-lesson .ttl { background:#fff; padding:0 10px 8px; font-size:12px; font-weight:600; color:var(--ink); }
    .video-lesson video { width:100%; aspect-ratio:16/9; display:block; background:#000; }
    .video-lesson .ft { background:#fff; padding:8px 10px; font-size:11px; color:var(--muted); }
    .note { font-size:12px; color:var(--muted); margin-top:8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">涨球</div>
    <div class="personas" data-coach-chat-personas="true" data-network-empty="true">
      <div class="persona on"><div class="n">AI 教练</div><div class="s">对话中</div></div>
      <div class="persona" data-coach-pick-slot="true"><div class="n">真实网络教练</div><div class="s">无教练</div></div>
    </div>
    <div class="tabs">
      <button class="tab on" type="button">对话指导</button>
      <button class="tab" type="button">视频指导</button>
    </div>
    <div class="bubble">
      想学正手上旋？先看下方讲解视频（页内可播，不用再去小红书/B站搜），再按提示练。
      <div class="video-lesson" data-coach-video-lesson="true" data-video-platform="bilibili" data-video-embed="native">
        <div class="hd">视频讲解 · B站</div>
        <div class="ttl">正手上旋讲解</div>
        <video controls playsinline preload="metadata" src="/tennis/examples/forehand-topspin.mp4"></video>
        <div class="ft">怎么练：先看完整挥拍路径，再上场慢喂 20 个。</div>
      </div>
      <div class="video-lesson" data-coach-video-lesson="true" data-video-platform="xiaohongshu" data-video-embed="native">
        <div class="hd">视频讲解 · 小红书</div>
        <div class="ttl">正手上旋讲解</div>
        <video controls playsinline preload="metadata" src="/tennis/examples/forehand-topspin.mp4"></video>
        <div class="ft">短视频讲解：重点看击球点与转肩。</div>
      </div>
    </div>
    <p class="note">无网络教练时头部只显示「无教练」，且不展示「网络教练留言」区块。</p>
  </div>
</body>
</html>
