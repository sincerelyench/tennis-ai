<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>涨球 · 真实登录显示名</title>
  <style>
    :root { color-scheme: light; --bg:#f3f6f4; --ink:#14201a; --line:#c5d2cb; --accent:#1f6b4a; }
    body { margin:0; font-family: "PingFang SC", "Noto Sans SC", sans-serif; background:linear-gradient(180deg,#e8f2ec,#f7faf8 40%,#eef3f0); color:var(--ink); }
    main { max-width: 720px; margin: 0 auto; padding: 28px 18px 64px; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    p { line-height: 1.55; }
    .card { background: rgba(255,255,255,.82); border:1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-top: 14px; }
    code { background:#e7eee9; padding: 1px 6px; border-radius: 6px; }
    .ok { color: var(--accent); font-weight: 600; }
    ul { padding-left: 1.1rem; }
  </style>
</head>
<body>
  <main>
    <h1>真实登录显示名</h1>
    <p>球友排行 / 匹配 / 网络教练 / 录入比分 / 演示赛标签，一律使用<strong>已登录用户资料里的显示名</strong>。没有真实用户时数量为 <span class="ok">0</span>，不再出现「陈晓」「林凯教练」等演示假名。</p>
    <div class="card">
      <p class="ok">验收要点</p>
      <ul>
        <li>个人页可保存显示名 → <code>/tennis/api/auth/profile</code></li>
        <li>球友本地排行 / 匹配池来自 <code>/tennis/api/friends/directory</code>；空则为 0</li>
        <li>网络教练列表过滤种子 <code>lin_kai</code> / 「林凯教练」</li>
        <li>录入比分默认填入当前登录显示名；演示赛「你」侧同名</li>
      </ul>
    </div>
  </main>
</body>
</html>
