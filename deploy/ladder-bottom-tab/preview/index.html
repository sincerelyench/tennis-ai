<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>排行榜底栏 Tab · 预览</title>
  <style>
    :root { --bg:#f7f7f5; --fg:#14201b; --muted:#66736c; --line:#e5e7e4; --pri:#0f7a4c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "PingFang SC","Noto Sans SC",sans-serif; background:linear-gradient(180deg,#eef6f1,#f7f7f5 40%); color:var(--fg); }
    .phone { max-width:390px; margin:24px auto; background:#fff; border:1px solid var(--line); min-height:720px; position:relative; padding-bottom:72px; }
    header { height:56px; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 16px; font-weight:700; }
    main { padding:16px; }
    h1 { font-size:16px; margin:0 0 12px; }
    .city { font-size:12px; color:var(--muted); margin-bottom:8px; }
    select { width:100%; height:36px; border-radius:8px; border:1px solid var(--line); padding:0 10px; margin-bottom:16px; }
    .card { border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .btn { background:var(--pri); color:#fff; border:0; border-radius:8px; height:36px; padding:0 12px; font-weight:600; }
    .muted { color:var(--muted); font-size:12px; }
    .tabs { position:absolute; left:0; right:0; bottom:0; height:64px; border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(4,1fr); background:#fff; }
    .tabs a { text-decoration:none; color:var(--muted); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:11px; }
    .tabs a.on { color:var(--pri); font-weight:700; }
    .note { max-width:390px; margin:0 auto 32px; padding:0 8px; font-size:13px; color:var(--muted); }
    .seg { display:flex; gap:8px; margin-bottom:12px; }
    .seg span { flex:1; text-align:center; padding:8px; border-radius:8px; background:#eef2ef; font-size:13px; font-weight:600; }
    .seg span.on { background:var(--pri); color:#fff; }
  </style>
</head>
<body>
  <div class="phone" data-preview="ladder-bottom-tab">
    <header>涨球</header>
    <main>
      <h1>排行榜</h1>
      <div class="city">城市</div>
      <select aria-label="城市"><option>杭州</option><option>北京</option></select>
      <div class="seg"><span class="on">单打</span><span>双打</span></div>
      <div class="card row">
        <div><strong>1 · 陈燕青</strong><div class="muted">UTR · 评分未经比赛证明</div></div>
        <span class="muted">我</span>
      </div>
      <div class="card row">
        <div><strong>2 · Ivy</strong><div class="muted">最近战绩可点开</div></div>
        <button class="btn" type="button">挑战</button>
      </div>
      <div class="card">
        <strong>比赛结果</strong>
        <p class="muted" style="margin:8px 0 0">已确认场次 · 比赛综述入口保留</p>
      </div>
    </main>
    <nav class="tabs" data-mobile-nav="preview">
      <a href="#yueqiu">约球</a>
      <a class="on" href="#ladder">排行榜</a>
      <a href="#coach">教练</a>
      <a href="#me">我的</a>
    </nav>
  </div>
  <p class="note">最终底栏（分析隐藏）：约球 · <strong>排行榜</strong> · 教练 · 我的。约球页不再有「我的约球 / 本地排行」顶栏双 Tab。</p>
</body>
</html>
