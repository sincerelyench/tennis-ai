<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>约球 · 点用户名弹窗看战绩</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.5; max-width: 40rem; }
    code { background: #f4f4f5; padding: 0.1em 0.35em; border-radius: 4px; }
    ol { padding-left: 1.25rem; }
  </style>
</head>
<body>
  <h1>本地排行点名弹窗（ZQ-78）</h1>
  <p>在<strong>本地排行</strong>点球员<strong>用户名</strong>，弹出最近战绩（非整页）。</p>
  <ol>
    <li>打开 <a href="/tennis/friends">/tennis/friends</a> →「本地排行」</li>
    <li>点某球员用户名（不要点挑战）</li>
    <li>弹窗显示最近战绩；关弹窗后仍在排行页</li>
  </ol>
  <p>四端：Web 为 APK / IPA / 微信小程序 WebView 源。</p>
</body>
</html>
