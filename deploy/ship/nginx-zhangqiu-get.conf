# Include from /etc/nginx/conf.d/ipitch.conf (before location /), then nginx -t && reload.
# Serves download landing + WeChat zip next to tennis-ai.apk under /var/www/apk/.

location = /get-zhangqiu.html {
    alias /var/www/apk/get-zhangqiu.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-cache";
}

location = /zhangqiu {
    alias /var/www/apk/get-zhangqiu.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-cache";
}

location = /mp-weixin.zip {
    alias /var/www/apk/mp-weixin.zip;
    default_type application/zip;
    add_header Content-Disposition 'attachment; filename="mp-weixin.zip"';
    add_header Cache-Control "no-cache";
}

location = /mp-weixin-README.txt {
    alias /var/www/apk/mp-weixin-README.txt;
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-cache";
}

# iOS sibling may upload later; keep the location ready.
location = /tennis-ai.ipa {
    alias /var/www/apk/tennis-ai.ipa;
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="tennis-ai.ipa"';
    add_header Cache-Control "no-cache";
}
