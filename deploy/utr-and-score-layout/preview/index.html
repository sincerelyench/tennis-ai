  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.5; max-width: 40rem; }

<body>
  <h1>UTR 风格等级分 + 约球录分布局</h1>
  <p>约球页顺序：<strong>成功记录 + 比赛记录</strong> → 新邀请 → 匹配约球。「录入比分」默认收起。</p>
  <ol>
    <li>打开 <a href="/tennis/friends">/tennis/friends</a> 匹配约球 tab</li>
    <li>确认顶部是「约球成功与比赛记录」，底部才是「匹配约球」</li>
    <li>默认只见「录入比分」按钮；点开后才出现表单</li>
    <li>点等级分旁「？」应看到局数预期 / match rating / 30 场 / 12 月 / (P)</li>
  </ol>
</body>
