<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>涨球 · 报告四维评分预览</title>
  <style>
    :root {
      --ink: #0f1f16;
      --muted: #5b6b62;
      --border: #d5e0d9;
      --card: #fff;
      --soft: #f4faf7;
      --primary: #0d9488;
      --bar: #0f766e;
      --bg: #e8f3ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #e8f3ec 0%, #f3f7f4 45%, #eef4f0 100%);
    }
    header {
      display: flex; align-items: center; gap: .65rem;
      padding: 1rem 1.25rem; max-width: 920px; margin: 0 auto;
    }
    .mark {
      width: 28px; height: 28px; border-radius: 8px;
      background: radial-gradient(circle at 35% 35%, #f5e547, #16a34a 55%, #0f766e);
    }
    h1 { font-size: 1.15rem; margin: 0; }
    main { max-width: 920px; margin: 0 auto; padding: 0 1rem 2.5rem; }
    .sheet {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.1rem 1rem 1.25rem;
      box-shadow: 0 8px 28px rgba(15, 31, 22, 0.06);
    }
    .meta { color: var(--muted); font-size: .85rem; margin: 0 0 1rem; }
    h2 { margin: 0 0 .65rem; font-size: 1.05rem; }
    .dim-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: .65rem; margin-bottom: 1rem;
    }
    .speed-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: .65rem;
    }
    .charts { display: grid; grid-template-columns: 1fr; gap: .75rem; }
    @media (min-width: 720px) {
      .dim-grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
      .speed-grid { grid-template-columns: repeat(5, minmax(0,1fr)); }
      .charts { grid-template-columns: 1fr 1fr; }
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: .75rem .85rem .7rem;
    }
    .lab { margin: 0; font-size: .75rem; color: var(--muted); }
    .val { margin: .35rem 0 .55rem; font-size: 1.55rem; font-weight: 750; letter-spacing: -.03em; line-height: 1; }
    .max { font-size: .8rem; color: var(--muted); font-weight: 500; }
    .bar { height: 7px; border-radius: 99px; background: var(--soft); overflow: hidden; }
    .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #14b8a6, var(--primary)); }
    .sval { margin: .4rem 0 0; font-size: 1.35rem; font-weight: 750; }
    .unit { font-size: .75rem; color: var(--muted); font-weight: 500; margin-left: 2px; }
    .note { margin: .65rem 0 1rem; font-size: .78rem; color: var(--muted); line-height: 1.45; }
    .panel { background: var(--soft); border: 1px solid var(--border); border-radius: 14px; padding: .75rem; }
    .panel h3 { margin: 0 0 .5rem; font-size: .85rem; color: var(--muted); font-weight: 600; }
    .hbar { display: grid; grid-template-columns: 4.5em 1fr 2em; gap: .5rem; align-items: center; margin-bottom: .55rem; }
    .hlab { font-size: .8rem; color: var(--muted); }
    .htrack { height: 12px; border-radius: 99px; background: #e7eeea; overflow: hidden; }
    .htrack > i { display: block; height: 100%; background: var(--bar); }
    .hnum { text-align: right; font-weight: 700; font-size: .85rem; }
    .coach { margin-top: 1rem; font-size: .85rem; color: var(--primary); }
  </style>
</head>
<body>
  <header>
    <div class="mark" aria-hidden="true"></div>
    <h1>涨球 · 报告四维评分</h1>
  </header>
  <main>
    <section class="sheet" id="report">
      <p class="meta">正手 · 演示数据 · 教练：涨球教练</p>
      <p class="meta">分数 74 · 中等 · 信息架构对齐参考图（品牌色保留涨球青绿）</p>

      <h2>四维评分</h2>
      <div class="dim-grid" id="dims"></div>

      <h2>速度估计</h2>
      <div class="speed-grid" id="speeds"></div>
      <p class="note" id="speedNote"></p>

      <div class="charts">
        <div class="panel">
          <h3>四维雷达</h3>
          <div id="radar"></div>
        </div>
        <div class="panel">
          <h3>分项条形</h3>
          <div id="bars"></div>
        </div>
      </div>
      <p class="coach">问题视频 / 涨球教练示范 / 球星示范保持现有报告区块，本预览只展示新增四维与速度层。</p>
    </section>
  </main>
  <script>
    const axes = [
      { key: "重心", value: 13, max: 25 },
      { key: "击球点", value: 9, max: 20 },
      { key: "动力链", value: 30, max: 30 },
      { key: "击球效果", value: 22, max: 25 },
    ];
    const speeds = [
      ["拍头", 83],
      ["手腕", 27],
      ["转髋", 7.7],
      ["来球", 102],
      ["出球", 121],
    ];
    const dims = document.getElementById("dims");
    axes.forEach((a) => {
      const pct = Math.round((a.value / a.max) * 100);
      dims.innerHTML += `<article class="card"><p class="lab">${a.key}</p><p class="val">${a.value}<span class="max"> / ${a.max}</span></p><div class="bar"><i style="width:${pct}%"></i></div></article>`;
    });
    const sg = document.getElementById("speeds");
    speeds.forEach(([lab, v]) => {
      const n = v >= 20 ? String(Math.round(v)) : v.toFixed(1);
      sg.innerHTML += `<article class="card"><p class="lab">${lab}</p><p class="sval">${n}<span class="unit">km/h</span></p></article>`;
    });
    document.getElementById("speedNote").textContent =
      "按身高或拍长把画面位移换成公里每小时，不是测速雷达。侧面更准，正面会偏慢。最快一拍拍头约 177 km/h。";

    const cx = 100, cy = 100, r = 72, n = axes.length;
    const grid = [0.4, 0.7, 1].map((k) => {
      const g = axes.map((_, i) => {
        const ang = -Math.PI / 2 + i * (2 * Math.PI / n);
        return `${cx + Math.cos(ang) * r * k},${cy + Math.sin(ang) * r * k}`;
      }).join(" ");
      return `<polygon points="${g}" fill="none" stroke="#d5e0d9" />`;
    }).join("");
    const pts = axes.map((a, i) => {
      const ang = -Math.PI / 2 + i * (2 * Math.PI / n);
      const v = a.value / a.max;
      return `${cx + Math.cos(ang) * r * v},${cy + Math.sin(ang) * r * v}`;
    }).join(" ");
    const labs = axes.map((a, i) => {
      const ang = -Math.PI / 2 + i * (2 * Math.PI / n);
      const x = cx + Math.cos(ang) * 94;
      const y = cy + Math.sin(ang) * 94;
      return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#5b6b62">${a.key}</text>`;
    }).join("");
    document.getElementById("radar").innerHTML =
      `<svg viewBox="0 0 200 200" width="220" height="220">${grid}<polygon points="${pts}" fill="rgba(13,148,136,.22)" stroke="#0d9488" stroke-width="1.8"/>${labs}</svg>`;

    const bars = document.getElementById("bars");
    axes.forEach((a) => {
      const pct = Math.round((a.value / a.max) * 100);
      bars.innerHTML += `<div class="hbar"><span class="hlab">${a.key}</span><div class="htrack"><i style="width:${pct}%"></i></div><span class="hnum">${a.value}</span></div>`;
    });
  </script>
</body>
</html>
