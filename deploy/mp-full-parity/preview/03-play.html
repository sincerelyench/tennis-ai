<!doctype html><html><head><meta charset="utf-8"><title>涨球</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;background:#e2e8f0;display:flex;justify-content:center;padding:24px}
.phone{width:390px;min-height:780px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 20px 50px rgba(15,23,42,.18);display:flex;flex-direction:column;position:relative}
.status{height:44px;background:#fff}
.content{flex:1;padding:16px 16px 84px;overflow:auto}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.logo{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#facc15,#0d9488);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px}
.brand b{font-size:18px}
h1{font-size:26px;font-weight:800;margin-bottom:6px}
.lead{color:#64748b;font-size:13px;line-height:1.5;margin-bottom:14px}
.card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-bottom:12px}
.h2{font-weight:700;margin-bottom:6px}
.btn{display:inline-block;background:#0d9488;color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:700;margin-top:8px}
.btn.ghost{background:#fff;color:#0f172a;border:1px solid #cbd5e1}
.chip{display:inline-block;padding:8px 12px;border-radius:999px;border:1px solid #cbd5e1;background:#fff;font-size:12px;margin:0 6px 6px 0}
.chip.on{background:#0d9488;border-color:#0d9488;color:#fff}
.field{height:40px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;padding:0 12px;display:flex;align-items:center;color:#64748b;margin:6px 0 10px}
.empty{border:2px dashed #cbd5e1;border-radius:12px;padding:24px;text-align:center;color:#64748b}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:64px;border-top:1px solid #e2e8f0;background:#fff;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#64748b;font-size:11px}
.tab.active{color:#0d9488;font-weight:700}
.icon{width:20px;height:20px;border:2px solid currentColor;border-radius:4px}
.hero{background:linear-gradient(145deg,#0f766e,#0d9488 55%,#14b8a6);color:#fff;border:none}
.bubble{background:#f1f5f9;border-radius:12px;padding:12px;margin-bottom:10px;font-size:14px;line-height:1.5}
</style></head>
<body><div class="phone"><div class="status"></div><div class="content">
<div class="brand"><div class="logo">↑</div><b>涨球</b></div>
<h1>约球</h1>
<p class="lead">yanqing · 无锡 · 水平 3.5</p>
<div class="card"><div class="h2">匹配约球</div>
<p class="lead">按水平、城市匹配附近球友。匹配成功后互相加微信自行约场地。</p>
<div class="field">无锡</div><div class="field">3.5</div>
<button class="btn">开始匹配</button>
<p class="lead" style="margin-top:8px">优先同城、水平接近。</p></div>
<div class="card"><div class="h2">录入比分</div>
<p class="lead">提交后需对方确认才会更新排名。</p>
<div class="field">球员 A</div><div class="field">球员 B</div>
<div class="field">6-4</div>
<button class="btn">提交比分</button></div>
</div><div class="tabbar"><div class="tab "><div class="icon"></div><span>分析</span></div><div class="tab active"><div class="icon"></div><span>约球</span></div><div class="tab "><div class="icon"></div><span>教练</span></div><div class="tab "><div class="icon"></div><span>我的</span></div></div></div></body></html>
